spring.application.name=library-service
spring.config.import=classpath:application-security.properties,classpath:application-logging.properties

server.port=8098

spring.datasource.url=jdbc:postgresql://localhost:5432/library
spring.datasource.username=library
spring.datasource.password=library
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=always

library.seed.member-password=BorrowSelf!26

library.borrowing.max-active-loans=5
library.borrowing.block-when-overdue=true
library.borrowing.loan-duration-days=14
library.health.minimum-free-disk=10MB

management.endpoints.web.exposure.exclude=health

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
